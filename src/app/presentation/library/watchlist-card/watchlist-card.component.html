<div class="flex bg-base-alt rounded-2xl
        ">
  <div
    class="rounded-2xl main-gradient
        max-w-[100px] min-w-[100px] max-h-[100px] min-h-[100px]
        md:max-w-[120px] md:min-w-[120px] md:max-h-[120px] md:min-h-[120px]
        lg:max-w-[140px] lg:min-w-[140px] lg:max-h-[140px] lg:min-h-[140px]
      ">
    <svg width="41" height="62" viewBox="0 0 41 62" fill="none" xmlns="http://www.w3.org/2000/svg"
         class="m-auto h-full">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M38.4653 11.5532V58L21.0367 46.9224C20.7093 46.7143 20.2912 46.7143 19.9638 46.9224L2.53516 58L2.53516 11.5532C2.53516 6.2771 6.55678 2 11.5177 2L29.4828 2C34.4437 2 38.4653 6.2771 38.4653 11.5532Z" stroke="white" stroke-width="4" stroke-linecap="round"/>

  </div>

  <div class="flex flex-row w-full justify-between">
    <div>
      <div class="
                    text-xl ml-2 mt-2
                    sm:text-xl sm:ml-4 sm:mt-4
                    md:text-2xl md:ml-8 md:mt-6
                    lg:text-3xl
            ">
        Watchlist
      </div>
      <div class="
                    text-sm ml-4 mt-1 text-sub-content
                    sm:ml-6 sm:mt-2
                    md:text-lg md:ml-10 md:mt-3
            ">
        {{ movieCount }} movies
      </div>
    </div>

    <div class="flex items-end m-4">
      <button class="btn btn-sm md:btn-md ml-1 min-w-10 lg:min-w-20"
              (click)="onClickEditWatchlist()"
      >Edit</button>
    </div>
  </div>


</div>
