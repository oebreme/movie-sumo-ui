<div>
  <div class="py-2 md:py-2 lg:py-4 lg:pl-24 pl-8">
    <span class="text-xl md:text-2xl lg:text-3xl xl:text-4xl text-white md:font-bold"> Currently trending </span>
  </div>
  <div class="carousel space-x-1 carousel-center max-w-[100vw] py-8 px-12">

    @if (isLoadingTrendingMovies) {
      @for (el of PLACEHOLDER_COUNT; track $index) {
        <div class="skeleton carousel-item bg-gray-900
                    min-h-max max-w-[60vw] min-w-[60vw]
                    sm:max-w-[40vw] sm:min-w-[40vw]
                    md:max-w-[30vw] md:min-w-[30vw]
                    lg:max-w-[270px] lg:min-w-[270px]"
        >
          <img src="assets/img/transparent-placeholder-500x750.png" alt="placeholder while loading">
        </div>
      }
    } @else {
      @for (movie of trendingMovies; track $index) {
        <moviesumo-trending-movie [movie]="movie"></moviesumo-trending-movie>
      }
    }
  </div>
</div>
